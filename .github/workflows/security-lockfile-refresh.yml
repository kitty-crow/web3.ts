name: Security lockfile refresh

on:
  push:
    branches:
      - 'agents/bun-zero-warning-ci'
    paths:
      - '.github/workflows/security-lockfile-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh dependencies within declared ranges
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Refresh all dependency resolutions within declared ranges
        run: |
          yarn install --ignore-scripts
          yarn upgrade --ignore-scripts

      - name: Verify the direct WebSocket runtime floor
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = fs.readFileSync('yarn.lock', 'utf8');
          if (!lock.includes('ws@^8.21.1')) {
            throw new Error('yarn.lock does not contain the required ws@^8.21.1 selector');
          }
          NODE

      - name: Capture dependency audits
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --json > audit-production.json
          echo $? > audit-production.exit-code
          yarn audit --json > audit-all.json
          echo $? > audit-all.exit-code
          exit 0

      - name: Commit regenerated lockfile
        if: github.ref == 'refs/heads/agents/bun-zero-warning-ci'
        shell: bash
        run: |
          if git diff --quiet -- yarn.lock; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yarn.lock
          git commit -m 'refresh compatible dependency resolutions'
          git push origin HEAD:agents/bun-zero-warning-ci

      - name: Upload regenerated lockfile and audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-lockfile-refresh
          path: |
            yarn.lock
            audit-production.json
            audit-production.exit-code
            audit-all.json
            audit-all.exit-code
          if-no-files-found: error
          retention-days: 7
