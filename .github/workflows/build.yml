name: Build and Test

on:
  push:
    branches:
      - '4.x'
      - 'agent/**'
    tags:
      - 'v4*'
  pull_request:
    branches:
      - '4.x'
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  YARN_VERSION: '1.22.22'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [cjs, esm, types, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build
        run: yarn build:${{ matrix.target }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Lint
        run: yarn lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Run unit tests
        run: yarn test:unit

  integration-hardhat:
    name: Integration Hardhat HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Start Hardhat
        run: npx hardhat node > /tmp/web3-hardhat.log 2>&1 &

      - name: Run Hardhat HTTP integration tests
        run: yarn test:e2e:hardhat:http

  integration-geth:
    name: Integration Geth ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        transport: [http, ws, ipc]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Run Geth integration tests
        run: yarn test:e2e:geth:${{ matrix.transport }}
