name: Build and Test

on:
  push:
    branches:
      - 'main'
      - '4.x'
      - 'agent/**'
    tags:
      - 'v4*'
  pull_request:
    branches:
      - 'main'
      - '4.x'
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  YARN_VERSION: '1.22.22'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [cjs, esm, types, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS prerequisite
        if: matrix.target != 'cjs'
        shell: bash
        run: |
          set -o pipefail
          yarn build:cjs 2>&1 | tee build-cjs-prerequisite.log

      - name: Build target
        shell: bash
        run: |
          set -o pipefail
          yarn build:${{ matrix.target }} 2>&1 | tee build-${{ matrix.target }}.log

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}-failure
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          yarn lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-failure
          path: lint.log
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          yarn test:unit 2>&1 | tee unit.log

      - name: Retain unit diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-diagnostics
          path: unit.log
          if-no-files-found: error
          retention-days: 3

  integration-hardhat:
    name: Integration Hardhat HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Start Hardhat
        run: npx hardhat node > /tmp/web3-hardhat.log 2>&1 &

      - name: Run Hardhat HTTP integration tests
        shell: bash
        run: |
          set -o pipefail
          yarn test:e2e:hardhat:http 2>&1 | tee integration-hardhat.log

      - name: Upload Hardhat diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-hardhat-failure
          path: |
            integration-hardhat.log
            /tmp/web3-hardhat.log
          if-no-files-found: ignore
          retention-days: 7

  integration-geth:
    name: Integration Geth ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        transport: [http, ws, ipc]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies without lifecycle scripts
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Initialise generated package files
        run: npx ts-node scripts/init.ts

      - name: Build CommonJS packages
        run: yarn build:cjs

      - name: Run Geth integration tests
        shell: bash
        run: |
          set -o pipefail
          yarn test:e2e:geth:${{ matrix.transport }} 2>&1 | tee integration-geth-${{ matrix.transport }}.log

      - name: Upload Geth diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-geth-${{ matrix.transport }}-failure
          path: integration-geth-${{ matrix.transport }}.log
          if-no-files-found: error
          retention-days: 7
