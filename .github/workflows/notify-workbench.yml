name: notify Web3 Workbench

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKBENCH_DISPATCH_TOKEN: ${{ secrets.WORKBENCH_DISPATCH_TOKEN }}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch vendor update
        if: env.WORKBENCH_DISPATCH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WORKBENCH_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kitty-crow/web3-workbench/dispatches \
            --data '{"event_type":"web3-main-updated","client_payload":{"sha":"${{ github.sha }}"}}'
      - name: Explain polling fallback
        if: env.WORKBENCH_DISPATCH_TOKEN == ''
        run: echo "WORKBENCH_DISPATCH_TOKEN is not configured; Workbench will pick this commit up through its hourly vendor poll."
