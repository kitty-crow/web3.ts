name: 'Bun compatibility / zero warnings'

on:
    push:
        branches:
            - '4.x'
    pull_request:
        branches:
            - '4.x'
        types: [opened, reopened, synchronize]
    workflow_dispatch:
    schedule:
        - cron: '17 4 * * *'

permissions:
    contents: read

concurrency:
    group: bun-zero-warning-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CI: 'true'
    FORCE_COLOR: '0'
    NO_COLOR: '1'
    NODE_OPTIONS: '--throw-deprecation --trace-warnings'

jobs:
    bun-zero-warning:
        name: Bun latest / build, lint, test, audit
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Set up latest Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest

            - name: Record Bun version
              run: |
                  bun --version
                  bun --revision

            - name: Verify registry resolution used by the monorepo
              run: |
                  bun info web3@4.16.0 version
                  bun info web3-hardhat-plugin@1.0.0 dependencies

            - name: Install from the existing dependency manifests
              shell: bash
              run: |
                  set -o pipefail
                  bun run scripts/ci/zero-warning.ts -- bun install --ignore-scripts --verbose 2>&1 | tee bun-install.log

            - name: Preserve Bun install diagnostics
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: bun-install-diagnostics
                  path: bun-install.log
                  if-no-files-found: error
                  retention-days: 7

            - name: Audit the resolved dependency graph
              run: bun run scripts/ci/zero-warning.ts -- bun audit --audit-level=low

            - name: Initialise test configuration with Bun
              run: bun run scripts/ci/zero-warning.ts -- bun run scripts/init.ts

            - name: Build CommonJS with Bun runtime compatibility
              run: bun run scripts/ci/zero-warning.ts -- bun --throw-deprecation --bun run build:cjs

            - name: Build ESM with Bun runtime compatibility
              run: bun run scripts/ci/zero-warning.ts -- bun --throw-deprecation --bun run build:esm

            - name: Build declarations with Bun runtime compatibility
              run: bun run scripts/ci/zero-warning.ts -- bun --throw-deprecation --bun run build:types

            - name: Build browser bundles with Bun runtime compatibility
              run: bun run scripts/ci/zero-warning.ts -- bun --throw-deprecation --bun run build:web

            - name: Lint with Bun runtime compatibility
              run: bun run scripts/ci/zero-warning.ts -- bun --throw-deprecation --bun run lint

            - name: Run unit tests with Bun runtime compatibility
              run: bun run scripts/ci/zero-warning.ts -- bun --throw-deprecation --bun run test:unit

            - name: Ensure Bun validation did not rewrite compatibility manifests
              shell: bash
              run: |
                  git diff --exit-code -- \
                    package.json \
                    yarn.lock \
                    ':(glob)packages/*/package.json' \
                    ':(glob)tools/*/package.json'
